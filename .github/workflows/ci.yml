name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── Download wasm-pack artifacts ─────────────────────────────────────────
      # The newest core release, pre-releases included. `main` is built against
      # the engine it will ship with, and between a core RC and its final
      # release that engine is the RC: an SDK API change lands with the core
      # release that carries it (Lpdf-devcycle.md §4.2 in lpdfio/lpdf), so
      # pinning to the last final release fails the build for the whole window.
      # release.yml and rc.yml stay pinned to the tag they ship.
      - name: Download wasm artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          CORE_TAG=$(gh api repos/lpdfio/lpdf/releases \
            --jq 'map(select(.draft | not))[0].tag_name // empty')
          if [ -z "$CORE_TAG" ]; then
            echo "::error::No published release in lpdfio/lpdf to build against."
            exit 1
          fi
          echo "Resolved core tag: $CORE_TAG"
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --pattern "lpdf-web.js" \
              --dir wasm \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download the engine files from core $CORE_TAG."
            exit 1
          fi
          echo "EFFECTIVE_CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      # ── Fetch test fixtures and snapshots from core ──────────────────────────
      - name: Fetch test fixtures and snapshots from core
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$EFFECTIVE_CORE_TAG" \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots
          mkdir -p test/fixtures test/snapshots
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          rm -rf _core

      - run: npm test
